<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquadLink Hub & Direct Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --input-bg: #21262d;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --msg-sent: #238636;
            --msg-received: #21262d;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container {
            width: 100%; max-width: 450px; height: 95vh; background: var(--card-bg);
            border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column;
            overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Login Screen */
        .login-screen {
            position: absolute; inset: 0; background: var(--card-bg); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; gap: 15px;
        }
        .login-title { font-size: 24px; font-weight: bold; color: var(--accent-color); }
        .custom-input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Header */
        .chat-header { padding: 12px 16px; background: #010409; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; background: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }

        /* Navigation Tabs */
        .tab-content { flex: 1; overflow-y: auto; display: none; padding: 15px; }
        .tab-content.active { display: flex; flex-direction: column; gap: 12px; }

        /* Home & Cards */
        .home-card { background: var(--input-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }

        /* Messages */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-sent { align-self: flex-start; }
        .msg-received { align-self: flex-end; }
        .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg-sent .msg-bubble { background: var(--msg-sent); color: #fff; }
        .msg-received .msg-bubble { background: var(--msg-received); border: 1px solid var(--border-color); }
        .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* Members List */
        .member-item { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .member-info { display: flex; align-items: center; gap: 10px; }
        .online-dot { width: 10px; height: 10px; background: #238636; border-radius: 50%; }
        .btn-sm { padding: 6px 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }

        /* Statuses */
        .status-item { background: var(--input-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .status-img { max-width: 100%; border-radius: 8px; margin-top: 8px; }

        /* Bottom Nav */
        .bottom-nav { height: 60px; background: #010409; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
        .nav-btn.active { color: var(--accent-color); font-weight: bold; }
        .nav-btn span { font-size: 18px; }

        /* Input Bar */
        .input-bar { padding: 10px; background: #010409; border-top: 1px solid var(--border-color); display: flex; gap: 6px; align-items: center; }
        .input-bar input[type="text"] { flex: 1; padding: 10px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 20px; color: #fff; outline: none; }
        .action-icon { background: #21262d; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-screen">
            <div class="login-title">SquadLink Hub 🚀</div>
            <input type="text" id="username-input" class="custom-input" placeholder="اسم المستخدم">
            <input type="text" id="room-input" class="custom-input" placeholder="رمز الغرفة العامة">
            <button class="btn-primary" onclick="saveAndJoin()">دخول التطبيق</button>
        </div>

        <!-- Header -->
        <div id="chat-header" class="chat-header hidden">
            <div class="header-info">
                <div class="avatar" id="header-avatar">M</div>
                <div>
                    <div id="room-name-display" style="font-weight:bold;">غرفة المحادثة</div>
                    <div id="chat-subtext" style="font-size:11px; color: #238636;">● متصل الان</div>
                </div>
            </div>
            <button id="back-to-room-btn" class="btn-sm hidden" onclick="resetToRoomChat()">الرجوع للعامة 🏠</button>
            <button onclick="logout()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:13px;">خروج 🚪</button>
        </div>

        <!-- 1. Home Tab -->
        <div id="tab-home" class="tab-content hidden">
            <div class="home-card">
                <h3>أهلاً بك في SquadLink! 👋</h3>
                <p style="font-size:12px; color:var(--text-muted); margin-top:5px;">تواصل، ابحث عن أصدقائك، وشارك لحظاتك.</p>
            </div>
            <div class="home-card">
                <h4>الغرفة الحالية 🔑</h4>
                <p id="home-room-id" style="color:var(--accent-color); font-size:18px; margin-top:5px;">-</p>
            </div>
        </div>

        <!-- 2. Chat Tab -->
        <div id="tab-chat" class="tab-content hidden">
            <div id="messages-list" style="display:flex; flex-direction:column; gap:10px; flex:1;"></div>
            
            <div id="input-bar" class="input-bar">
                <label class="action-icon" for="file-input">📎</label>
                <input type="file" id="file-input" class="hidden" onchange="handleFileUpload(event)">
                <button id="mic-btn" class="action-icon" onclick="toggleRecording()">🎤</button>
                <input type="text" id="message-text" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="action-icon" style="background:var(--accent-color)" onclick="sendMsg()">➤</button>
            </div>
        </div>

        <!-- 3. Members Tab -->
        <div id="tab-members" class="tab-content hidden">
            <input type="text" id="search-member-input" class="custom-input" placeholder="🔍 ابحث عن عضو باسمه..." onkeyup="filterMembers()">
            <div id="members-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <!-- 4. Status Tab -->
        <div id="tab-status" class="tab-content hidden">
            <div class="home-card">
                <h4>إضافة حالة جديدة ⭕</h4>
                <input type="text" id="status-text" class="custom-input" placeholder="ماذا تفكر الآن؟" style="margin: 10px 0;">
                
                <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                    <label class="btn-sm" for="status-file-input" style="background:var(--input-bg); border:1px solid var(--border-color); flex:1;">📷 إضافة صورة للحالة</label>
                    <input type="file" id="status-file-input" accept="image/*" class="hidden" onchange="previewStatusImage(event)">
                    <span id="status-img-name" style="font-size:11px; color:var(--text-muted);"></span>
                </div>
                
                <button class="btn-primary" onclick="postStatus()">نشر الحالة</button>
            </div>
            <div id="statuses-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div id="bottom-nav" class="bottom-nav hidden">
            <button class="nav-btn" onclick="switchTab('home')" id="nav-home"><span>🏠</span>الرئيسية</button>
            <button class="nav-btn active" onclick="switchTab('chat')" id="nav-chat"><span>💬</span>الشات</button>
            <button class="nav-btn" onclick="switchTab('members')" id="nav-members"><span>👥</span>الأعضاء</button>
            <button class="nav-btn" onclick="switchTab('status')" id="nav-status"><span>⭕</span>الحالات</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let currentRoom = "";
        let currentChatPath = "";
        let isPrivateChat = false;
        let selectedStatusImgBase64 = null;

        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('squadlink_user');
            const savedRoom = localStorage.getItem('squadlink_room');
            if (savedUser && savedRoom) {
                document.getElementById('username-input').value = savedUser;
                document.getElementById('room-input').value = savedRoom;
                joinRoom(savedUser, savedRoom);
            }
        });

        function saveAndJoin() {
            const user = document.getElementById('username-input').value.trim();
            const room = document.getElementById('room-input').value.trim();
            if (!user || !room) return alert("من فضلك أدخل البيانات!");
            localStorage.setItem('squadlink_user', user);
            localStorage.setItem('squadlink_room', room);
            joinRoom(user, room);
        }

        function joinRoom(user, room) {
            currentUser = user;
            currentRoom = room;
            currentChatPath = 'rooms/' + currentRoom + '/messages';

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            
            document.getElementById('room-name-display').innerText = "غرفة: " + currentRoom;
            document.getElementById('home-room-id').innerText = currentRoom;
            document.getElementById('header-avatar').innerText = currentUser.charAt(0).toUpperCase();

            // تسجيل حضور العضو في قائمة الأعضاء
            db.ref('rooms/' + currentRoom + '/members/' + currentUser).set({
                name: currentUser, online: true, lastSeen: Date.now()
            });
            db.ref('rooms/' + currentRoom + '/members/' + currentUser).onDisconnect().remove();

            switchTab('chat');
            listenToMessages();
            listenToMembers();
            listenToStatuses();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active', 'hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        /* Chat Logic (Room & Direct Messages) */
        function listenToMessages() {
            db.ref(currentChatPath).off(); // إلغاء الاستماع القديم
            db.ref(currentChatPath).on('value', (snapshot) => {
                const list = document.getElementById('messages-list');
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) return;

                Object.keys(data).forEach(id => renderMessage(data[id]));
                list.parentElement.scrollTop = list.parentElement.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('message-text');
            if (!input.value.trim()) return;
            db.ref(currentChatPath).push({
                sender: currentUser, text: input.value.trim(), timestamp: Date.now()
            });
            input.value = "";
        }

        /* Members & Direct Chat Creation */
        function listenToMembers() {
            db.ref('rooms/' + currentRoom + '/members').on('value', (snapshot) => {
                const list = document.getElementById('members-list');
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) return;

                Object.values(data).forEach(member => {
                    if (member.name === currentUser) return; // عدم إظهار نفسي في الشات الفردي

                    const item = document.createElement('div');
                    item.className = "member-item member-node";
                    item.setAttribute('data-name', member.name.toLowerCase());
                    item.innerHTML = `
                        <div class="member-info">
                            <div class="online-dot"></div>
                            <span style="font-weight:500;">${member.name}</span>
                        </div>
                        <button class="btn-sm" onclick="startPrivateChat('${member.name}')">محادثة خاصة 💬</button>
                    `;
                    list.appendChild(item);
                });
            });
        }

        function filterMembers() {
            const query = document.getElementById('search-member-input').value.toLowerCase();
            document.querySelectorAll('.member-node').forEach(node => {
                const name = node.getAttribute('data-name');
                node.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        function startPrivateChat(targetUser) {
            isPrivateChat = true;
            const privateChatId = [currentUser, targetUser].sort().join('_private_');
            currentChatPath = 'private_chats/' + privateChatId;

            document.getElementById('room-name-display').innerText = "خاص مع: " + targetUser;
            document.getElementById('chat-subtext').innerText = "محادثة مشفرة فردية";
            document.getElementById('back-to-room-btn').classList.remove('hidden');

            switchTab('chat');
            listenToMessages();
        }

        function resetToRoomChat() {
            isPrivateChat = false;
            currentChatPath = 'rooms/' + currentRoom + '/messages';

            document.getElementById('room-name-display').innerText = "غرفة: " + currentRoom;
            document.getElementById('chat-subtext').innerText = "● متصل الان";
            document.getElementById('back-to-room-btn').classList.add('hidden');

            switchTab('chat');
            listenToMessages();
        }

        /* Statuses & Images */
        function previewStatusImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 1.5 * 1024 * 1024) return alert("حجم الصورة كبير جداً!");

            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedStatusImgBase64 = evt.target.result;
                document.getElementById('status-img-name').innerText = file.name.substring(0, 15) + "...";
            };
            reader.readAsDataURL(file);
        }

        function postStatus() {
            const text = document.getElementById('status-text').value.trim();
            if (!text && !selectedStatusImgBase64) return alert("اكتب نصاً أو اختر صورة لنشر الحالة!");

            db.ref('rooms/' + currentRoom + '/statuses').push({
                sender: currentUser, text: text || "", image: selectedStatusImgBase64 || null, timestamp: Date.now()
            });

            document.getElementById('status-text').value = "";
            document.getElementById('status-file-input').value = "";
            document.getElementById('status-img-name').innerText = "";
            selectedStatusImgBase64 = null;
        }

        function listenToStatuses() {
            db.ref('rooms/' + currentRoom + '/statuses').on('value', (snapshot) => {
                const list = document.getElementById('statuses-list');
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) return;

                Object.values(data).reverse().forEach(s => {
                    const item = document.createElement('div');
                    item.className = "status-item";
                    item.innerHTML = `
                        <div style="font-weight:bold; color:var(--accent-color); font-size:13px;">${s.sender}</div>
                        ${s.text ? `<div style="margin-top:4px;">${s.text}</div>` : ''}
                        ${s.image ? `<img src="${s.image}" class="status-img" />` : ''}
                    `;
                    list.appendChild(item);
                });
            });
        }

        /* File Uploads & Recording in Chat */
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 1.5 * 1024 * 1024) return alert("الحد الأقصى للملف 1.5 ميجابايت");

            const reader = new FileReader();
            reader.onload = function(evt) {
                db.ref(currentChatPath).push({
                    sender: currentUser,
                    fileData: evt.target.result,
                    fileName: file.name,
                    fileType: file.type,
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
        }

        async function toggleRecording() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const r = new FileReader();
                    r.onloadend = () => {
                        db.ref(currentChatPath).push({
                            sender: currentUser, audio: r.result, timestamp: Date.now()
                        });
                    };
                    r.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                micBtn.style.background = "#ef4444";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.style.background = "#21262d";
            }
        }

        function renderMessage(msg) {
            const list = document.getElementById('messages-list');
            const isMe = msg.sender === currentUser;
            const div = document.createElement('div');
            div.className = `msg-wrapper ${isMe ? 'msg-sent' : 'msg-received'}`;

            let content = msg.text ? `<div>${msg.text}</div>` : '';
            if (msg.audio) content += `<audio controls src="${msg.audio}" style="max-width:100%; height:30px;"></audio>`;
            if (msg.fileData) {
                if (msg.fileType.startsWith('image/')) {
                    content += `<img src="${msg.fileData}" class="chat-img" />`;
                } else {
                    content += `<a href="${msg.fileData}" download="${msg.fileName}" style="color:var(--accent-color);">📁 ${msg.fileName}</a>`;
                }
            }

            div.innerHTML = `
                <div class="msg-sender">${msg.sender}</div>
                <div class="msg-bubble">${content}</div>
            `;
            list.appendChild(div);
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
