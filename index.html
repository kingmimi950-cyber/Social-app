<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الشات - تطوير محمد خميس</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --green: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 10px; height: 100vh; }
        .chat-container { width: 100%; max-width: 480px; background: var(--card); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; height: 100%; position: relative; }
        
        .chat-header { padding: 12px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; position: relative; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #64748b; position: absolute; bottom: 0; left: 0; border: 2px solid var(--card); }
        .status-dot.online { background: var(--green); }
        .dev-tag { font-size: 10px; background: rgba(59, 130, 246, 0.2); color: #93c5fd; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--accent); }

        .pinned-bar { background: #1a2234; padding: 8px 12px; border-bottom: 1px solid #334155; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
        .pinned-bar span { color: var(--text); font-weight: bold; }

        .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; position: relative; word-break: break-word; }
        .msg.sent { align-self: flex-start; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-end; background: #334155; color: #fff; border-bottom-left-radius: 2px; }
        
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 10px; opacity: 0.8; margin-top: 4px; }
        .seen-status.read { color: #38bdf8; font-weight: bold; }

        audio { max-width: 100%; height: 36px; margin-top: 4px; }
        .typing-txt { font-size: 11px; color: var(--green); padding: 4px 16px; font-style: italic; min-height: 20px; }

        .input-area { padding: 10px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 6px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; outline: none; }
        
        .icon-btn { background: #334155; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
        .icon-btn.recording { background: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .send-btn { background: var(--accent); border: none; color: #fff; padding: 0 16px; height: 36px; border-radius: 18px; font-weight: bold; cursor: pointer; }
        
        .login-screen { position: absolute; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; justify-content: center; padding: 20px; gap: 12px; }
        .login-screen input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
        .hidden { display: none !important; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="chat-container">
        <!-- شاشة الدخول -->
        <div id="login-screen" class="login-screen">
            <h2 style="text-align:center;">💬 دخول الشات</h2>
            <input type="text" id="user-input" placeholder="اكتب اسمك...">
            <input type="text" id="room-input" placeholder="اسم أو كود الغرفة...">
            <button class="send-btn" style="width:100%; height:45px;" onclick="initChat()">دخول المحادثة</button>
        </div>

        <!-- رأس التطبيق -->
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar">
                    <span id="avatar-char">U</span>
                    <div id="online-dot" class="status-dot"></div>
                </div>
                <div>
                    <div id="room-title" style="font-weight:bold; font-size:14px;">غرفة: --</div>
                    <small id="user-status-txt" style="color:var(--muted); font-size:11px;">غير متصل</small>
                </div>
            </div>
            <div class="dev-tag">تطوير: محمد خميس 👑</div>
        </div>

        <!-- تثبيت الرسائل -->
        <div id="pinned-bar" class="pinned-bar hidden">
            <div>📌 مثبت: <span id="pinned-text">--</span></div>
            <button onclick="unpinMessage()" style="background:none; border:none; color:var(--muted); cursor:pointer;">✕</button>
        </div>

        <!-- صندوق المحادثة -->
        <div id="chat-box" class="chat-box"></div>

        <!-- جاري الكتابة -->
        <div id="typing-indicator" class="typing-txt"></div>

        <!-- الإدخال -->
        <div class="input-area">
            <button id="mic-btn" class="icon-btn" onclick="toggleAudioRecord()">🎙️</button>
            <input type="text" id="msg-input" placeholder="اكتب رسالة..." oninput="handleTyping()">
            <button class="send-btn" onclick="sendTextMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let currentRoom = "";
        let typingTimeout = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function initChat() {
            currentUser = document.getElementById('user-input').value.trim();
            currentRoom = document.getElementById('room-input').value.trim();

            if (!currentUser || !currentRoom) {
                alert("يرجى إدخال اسمك واسم الغرفة!");
                return;
            }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('room-title').innerText = "غرفة: " + currentRoom;
            document.getElementById('avatar-char').innerText = currentUser.charAt(0).toUpperCase();

            // حالة التواجد
            const userPresenceRef = db.ref(`chat_rooms/${currentRoom}/users/${currentUser}`);
            userPresenceRef.set({ online: true });
            userPresenceRef.onDisconnect().set({ online: false });

            // متابعة متصلي الغرفة
            db.ref(`chat_rooms/${currentRoom}/users`).on('value', snapshot => {
                const users = snapshot.val() || {};
                let isOtherOnline = false;
                Object.keys(users).forEach(u => {
                    if (u !== currentUser && users[u].online) isOtherOnline = true;
                });
                
                const dot = document.getElementById('online-dot');
                const txt = document.getElementById('user-status-txt');
                if (isOtherOnline) {
                    dot.classList.add('online');
                    txt.innerText = "متصل الآن 🟢";
                } else {
                    dot.classList.remove('online');
                    txt.innerText = "غير متصل 🔴";
                }
            });

            // استلام الرسائل
            db.ref(`chat_rooms/${currentRoom}/messages`).on('child_added', snapshot => {
                const msg = snapshot.val();
                const msgKey = snapshot.key;
                renderMessage(msgKey, msg);

                if (msg.sender !== currentUser && !msg.readBy) {
                    db.ref(`chat_rooms/${currentRoom}/messages/${msgKey}/readBy`).set(true);
                }
            });

            // تحديث حالة القراءة (Seen)
            db.ref(`chat_rooms/${currentRoom}/messages`).on('child_changed', snapshot => {
                const msgKey = snapshot.key;
                const msg = snapshot.val();
                const seenElem = document.getElementById(`seen-${msgKey}`);
                if (seenElem && msg.readBy) {
                    seenElem.classList.add('read');
                    seenElem.innerText = "✔✔";
                }
            });

            // مؤشر الكتابة
            db.ref(`chat_rooms/${currentRoom}/typing`).on('value', snapshot => {
                const typingUser = snapshot.val();
                const indicator = document.getElementById('typing-indicator');
                if (typingUser && typingUser !== currentUser) {
                    indicator.innerText = `✍️ ${typingUser} يكتب الآن...`;
                } else {
                    indicator.innerText = "";
                }
            });

            // الرسالة المثبتة
            db.ref(`chat_rooms/${currentRoom}/pinned`).on('value', snapshot => {
                const pinnedText = snapshot.val();
                const bar = document.getElementById('pinned-bar');
                if (pinnedText) {
                    bar.classList.remove('hidden');
                    document.getElementById('pinned-text').innerText = pinnedText;
                } else {
                    bar.classList.add('hidden');
                }
            });
        }

        function sendTextMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            db.ref(`chat_rooms/${currentRoom}/messages`).push({
                sender: currentUser,
                text: text,
                type: 'text',
                timestamp: Date.now(),
                readBy: false
            });

            input.value = '';
            clearTyping();
        }

        function renderMessage(key, msg) {
            const box = document.getElementById('chat-box');
            const isMe = (msg.sender === currentUser);
            
            let contentHTML = '';
            if (msg.type === 'text') {
                contentHTML = `<div>${msg.text}</div>`;
            } else if (msg.type === 'audio') {
                contentHTML = `<audio controls src="${msg.fileUrl}"></audio>`;
            }

            const seenIcon = msg.readBy ? '<span class="seen-status read">✔✔</span>' : '<span class="seen-status">✔</span>';

            const msgHTML = `
                <div class="msg ${isMe ? 'sent' : 'received'}" id="msg-${key}">
                    <div style="font-size:10px; font-weight:bold; color:#93c5fd; margin-bottom:2px;">${msg.sender}</div>
                    ${contentHTML}
                    <div class="msg-meta">
                        <span>${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        ${isMe ? `<span id="seen-${key}">${seenIcon}</span>` : ''}
                        <button onclick="pinMessage('${msg.text || 'رسالة صوتية'}')" style="background:none; border:none; cursor:pointer; font-size:10px;">📌</button>
                    </div>
                </div>
            `;

            box.innerHTML += msgHTML;
            box.scrollTop = box.scrollHeight;
        }

        function handleTyping() {
            db.ref(`chat_rooms/${currentRoom}/typing`).set(currentUser);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(clearTyping, 2000);
        }

        function clearTyping() {
            db.ref(`chat_rooms/${currentRoom}/typing`).set("");
        }

        // تسجيل وصوتيات
        async function toggleAudioRecord() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            db.ref(`chat_rooms/${currentRoom}/messages`).push({
                                sender: currentUser,
                                fileUrl: reader.result,
                                type: 'audio',
                                timestamp: Date.now(),
                                readBy: false
                            });
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                } catch (err) {
                    alert("يرجى تفعيل صلاحية الميكروفون!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        }

        function pinMessage(text) {
            db.ref(`chat_rooms/${currentRoom}/pinned`).set(text);
        }

        function unpinMessage() {
            db.ref(`chat_rooms/${currentRoom}/pinned`).remove();
        }
    </script>
</body>
</html>
