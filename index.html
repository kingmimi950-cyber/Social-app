<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Pro App</title>
    <!-- الأساسيات: Google Fonts و Firebase SDK -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* تعريف المتغيرات للألوان (دعم الوضع الليلي/النهاري لاحقاً) */
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
            --msg-sent: #6366f1;
            --msg-recv: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container { width: 100%; max-width: 450px; height: 95vh; background: var(--card); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; position: relative; }

        /* شاشة الدخول */
        #login-screen { position: absolute; inset: 0; background: var(--card); z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 20px; gap: 15px; }
        
        /* الهيدر */
        #chat-header { padding: 15px; background: #0f172a; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        
        /* منطقة الرسائل */
        #messages-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        /* منطقة الإدخال */
        #input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; align-items: center; }
        
        input { padding: 12px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: white; flex: 1; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. شاشة الدخول -->
        <div id="login-screen">
            <h2 style="text-align: center; color: var(--primary);">Chat Pro 🚀</h2>
            <input type="text" id="username-input" placeholder="اسم المستخدم...">
            <input type="text" id="room-input" placeholder="رمز الغرفة...">
            <button onclick="saveAndJoin()">دخول الشات</button>
        </div>

        <!-- 2. الهيدر -->
        <div id="chat-header" class="hidden">
            <h4 id="room-name-display">...</h4>
            <div id="status-indicator">●</div>
        </div>

        <!-- 3. الرسائل -->
        <div id="messages-list" class="hidden"></div>

        <!-- 4. منطقة الكتابة -->
        <div id="input-area" class="hidden">
            <input type="text" id="message-text" placeholder="اكتب رسالة...">
            <button onclick="sendMsg()">إرسال</button>
        </div>
    </div>

    <script>
        // إعدادات الاتصال (سيتم ملؤها في الجزء الثاني)
        const firebaseConfig = { databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
                // ==========================================
        // الجزء الثاني: المتغيرات العامة والحفظ التلقائي
        // ==========================================
        let currentUser = "";
        let currentRoom = "";
        let replyToMsgId = null;  // لتحديد الرسالة المراد الرد عليها
        let editMsgId = null;     // لتحديد الرسالة المراد تعديلها

        // 1. الدخول التلقائي فور فتح الصفحة (زي واتساب)
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('chat_user');
            const savedRoom = localStorage.getItem('chat_room');

            if (savedUser && savedRoom) {
                document.getElementById('username-input').value = savedUser;
                document.getElementById('room-input').value = savedRoom;
                // دخول تلقائي مباشر
                joinRoom(savedUser, savedRoom);
            }
        });

        // 2. زر الدخول اليدوي / الحفظ
        function saveAndJoin() {
            const user = document.getElementById('username-input').value.trim();
            const room = document.getElementById('room-input').value.trim();

            if (!user || !room) {
                alert("برجاء إدخال اسمك ورمز الغرفة أولاً!");
                return;
            }

            // حفظ البيانات في جهاز المستخدم للمرات القادمة
            localStorage.setItem('chat_user', user);
            localStorage.setItem('chat_room', room);

            joinRoom(user, room);
        }

        // 3. تهيئة الغرفة والانتقال لشاشة المحادثة
        function joinRoom(user, room) {
            currentUser = user;
            currentRoom = room;

            // إخفاء شاشة الدخول وإظهار واجهة الشات
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('input-area').classList.remove('hidden');

            document.getElementById('room-name-display').innerText = "غرفة: " + currentRoom;

            // البدء في الاستماع للرسائل الجديدة من Firebase
            listenToMessages();
        }
               // ==========================================
        // الجزء الثالث: إرسال، عرض، تعديل وحذف الرسائل
        // ==========================================

        // 1. الاستماع للرسائل من Firebase والتحديث الفوري
        function listenToMessages() {
            const roomRef = db.ref('rooms/' + currentRoom + '/messages');
            
            roomRef.on('value', (snapshot) => {
                const messagesList = document.getElementById('messages-list');
                messagesList.innerHTML = ""; // تفريغ الشاشة قبل إعادة الرسم

                const data = snapshot.val();
                if (!data) return;

                Object.keys(data).forEach((msgId) => {
                    const msg = data[msgId];
                    renderMessage(msgId, msg);
                });

                // التمرير لأسفل تلقائياً عند وصول رسالة جديدة
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        // 2. دالة إرسال أو تعديل الرسالة
        function sendMsg() {
            const inputField = document.getElementById('message-text');
            const text = inputField.value.trim();

            if (!text) return;

            // إذا كنا في وضع "تعديل رسالة قديمة"
            if (editMsgId) {
                db.ref('rooms/' + currentRoom + '/messages/' + editMsgId).update({
                    text: text,
                    isEdited: true
                });
                editMsgId = null;
                inputField.value = "";
                return;
            }

            // إرسال رسالة جديدة (أو رد على رسالة)
            const newMsgRef = db.ref('rooms/' + currentRoom + '/messages').push();
            const msgData = {
                sender: currentUser,
                text: text,
                timestamp: Date.now(),
                replyTo: replyToMsgId || null
            };

            newMsgRef.set(msgData);

            // إعادة ضبط الخانات
            inputField.value = "";
            replyToMsgId = null;
        }

        // 3. رسم وتصميم شكل الرسالة داخل المحادثة
        function renderMessage(msgId, msg) {
            const messagesList = document.getElementById('messages-list');
            const isMe = msg.sender === currentUser;

            const msgDiv = document.createElement('div');
            msgDiv.style.display = "flex";
            msgDiv.style.flexDirection = "column";
            msgDiv.style.alignItems = isMe ? "flex-end" : "flex-start";
            msgDiv.style.margin = "5px 0";

            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            msgDiv.innerHTML = `
                <div style="font-size: 11px; color: #94a3b8; margin-bottom: 2px;">${msg.sender}</div>
                <div style="background: ${isMe ? 'var(--msg-sent)' : 'var(--msg-recv)'}; color: white; padding: 10px 14px; border-radius: 12px; max-width: 80%; word-break: break-word; position: relative;">
                    ${msg.replyTo ? `<div style="background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 5px;">رد على رسالة...</div>` : ''}
                    <div>${msg.text}</div>
                    <div style="font-size: 9px; color: #cbd5e1; text-align: left; margin-top: 4px;">
                        ${timeStr} ${msg.isEdited ? '(معدلة)' : ''}
                    </div>
                </div>
                <div style="display: flex; gap: 8px; font-size: 11px; margin-top: 3px; color: #94a3b8; cursor: pointer;">
                    <span onclick="setReply('${msgId}')">رد</span>
                    ${isMe ? `<span onclick="setEdit('${msgId}', '${msg.text}')">تعديل</span>` : ''}
                    ${isMe ? `<span onclick="deleteMsg('${msgId}')" style="color:#ef4444;">حذف</span>` : ''}
                </div>
            `;

            messagesList.appendChild(msgDiv);
        }

        // 4. وظائف التحكم بالرسالة (رد، تعديل، حذف)
        function setReply(msgId) {
            replyToMsgId = msgId;
            alert("سيتم الرد على هذه الرسالة.");
        }

        function setEdit(msgId, oldText) {
            editMsgId = msgId;
            const inputField = document.getElementById('message-text');
            inputField.value = oldText;
            inputField.focus();
        }

        function deleteMsg(msgId) {
            if (confirm("هل تريد حذف هذه الرسالة لدى الجميع؟")) {
                db.ref('rooms/' + currentRoom + '/messages/' + msgId).remove();
            }
        }
         // ==========================================
        // الجزء الرابع والأخير: الريأكشنز، الثيم، والإغلاق
        // ==========================================

        // 1. نظام الريأكشنز (إضافة إيموجي للرسالة)
        function addReaction(msgId, emoji) {
            db.ref('rooms/' + currentRoom + '/messages/' + msgId + '/reactions/' + currentUser).set(emoji);
        }

        // 2. نظام التبديل بين الوضع الليلي والنهاري
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                document.documentElement.style.setProperty('--bg', '#f1f5f9');
                document.documentElement.style.setProperty('--card', '#ffffff');
                document.documentElement.style.setProperty('--text', '#0f172a');
            } else {
                document.documentElement.style.setProperty('--bg', '#0f172a');
                document.documentElement.style.setProperty('--card', '#1e293b');
                document.documentElement.style.setProperty('--text', '#f8fafc');
            }
        }
    </script>

    <!-- زر التبديل بين الليلي والنهاري (يمكنك وضعه في أي مكان) -->
    <button onclick="toggleTheme()" style="position:fixed; top:10px; right:10px; padding:5px 10px; font-size:12px;">تغيير اللون</button>

</body>
</html>
