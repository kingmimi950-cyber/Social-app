<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquadLink Pro - Ultimate Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --input-bg: #21262d;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --msg-sent: #238636;
            --msg-received: #21262d;
            --border-color: #30363d;
        }

        /* Themes */
        body.theme-light {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --input-bg: #f3f4f6;
            --accent-color: #0969da;
            --text-color: #24292f;
            --text-muted: #57606a;
            --msg-sent: #2da44e;
            --msg-received: #f3f4f6;
            --border-color: #d0d7de;
        }

        body.theme-cyber {
            --bg-color: #0f051d;
            --card-bg: #1d0c36;
            --input-bg: #2d1254;
            --accent-color: #f706cf;
            --text-color: #00f0ff;
            --text-muted: #b57cff;
            --msg-sent: #8a00c2;
            --msg-received: #2d1254;
            --border-color: #f706cf;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; justify-content: center; align-items: center; transition: 0.3s; }

        .app-container {
            width: 100%; max-width: 450px; height: 95vh; background: var(--card-bg);
            border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column;
            overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Login Screen */
        .login-screen {
            position: absolute; inset: 0; background: var(--card-bg); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; gap: 12px;
        }
        .login-title { font-size: 24px; font-weight: bold; color: var(--accent-color); }
        .custom-input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-color); outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Header */
        .chat-header { padding: 12px 16px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; background: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }

        /* Tabs */
        .tab-content { flex: 1; overflow-y: auto; display: none; padding: 15px; }
        .tab-content.active { display: flex; flex-direction: column; gap: 12px; }

        .home-card { background: var(--input-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }

        /* Pinned Message Bar */
        .pinned-bar { background: rgba(88, 166, 255, 0.15); border-right: 4px solid var(--accent-color); padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }

        /* Messages */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-sent { align-self: flex-start; }
        .msg-received { align-self: flex-end; }
        .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
        .msg-sent .msg-bubble { background: var(--msg-sent); color: #fff; }
        .msg-received .msg-bubble { background: var(--msg-received); border: 1px solid var(--border-color); }
        .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
        .seen-status { font-size: 11px; margin-right: 5px; }

        /* Polls */
        .poll-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-top: 5px; }
        .poll-option-btn { width: 100%; text-align: right; padding: 8px; margin-top: 5px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }

        /* Actions */
        .action-bar-sm { display: flex; gap: 8px; font-size: 11px; margin-top: 5px; color: var(--text-muted); flex-wrap: wrap; }
        .action-bar-sm span { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .action-bar-sm span:hover { background: rgba(255,255,255,0.1); color: var(--accent-color); }

        /* Members */
        .member-item { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .online-dot { width: 10px; height: 10px; background: #238636; border-radius: 50%; }
        .btn-sm { padding: 6px 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }

        /* Bottom Nav */
        .bottom-nav { height: 60px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .nav-btn.active { color: var(--accent-color); font-weight: bold; }
        .nav-btn span { font-size: 16px; }

        /* Input Bar */
        .input-bar { padding: 10px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-color); display: flex; gap: 6px; align-items: center; }
        .input-bar input[type="text"] { flex: 1; padding: 10px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-color); outline: none; }
        .action-icon { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .theme-select { width: 100%; padding: 8px; margin-top: 10px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-screen">
            <div class="login-title">SquadLink Pro 🚀</div>
            <input type="text" id="username-input" class="custom-input" placeholder="اسم المستخدم">
            <input type="text" id="room-input" class="custom-input" placeholder="رمز الغرفة العامة">
            <button class="btn-primary" onclick="saveAndJoin()">دخول التطبيق</button>
        </div>

        <!-- Header -->
        <div id="chat-header" class="chat-header hidden">
            <div class="header-info">
                <div class="avatar" id="header-avatar">M</div>
                <div>
                    <div id="room-name-display" style="font-weight:bold;">غرفة المحادثة</div>
                    <div id="chat-subtext" style="font-size:11px; color: #238636;">● متصل الان</div>
                </div>
            </div>
            <button id="back-to-room-btn" class="btn-sm hidden" onclick="resetToRoomChat()">الرجوع للعامة 🏠</button>
            <button onclick="logout()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:13px;">خروج 🚪</button>
        </div>

        <!-- 1. Home Tab -->
        <div id="tab-home" class="tab-content hidden">
            <div class="home-card">
                <h3>أهلاً بك في SquadLink! 👋</h3>
                <p style="font-size:12px; color:var(--text-muted); margin-top:5px;">تخصيص الثيم وإعدادات الحساب</p>
                <select class="theme-select" onchange="changeTheme(this.value)">
                    <option value="dark">🎨 الثيم الغامق (افتراضي)</option>
                    <option value="light">☀️ الثيم الفاتح</option>
                    <option value="cyber">⚡ ثيم السايبر بنك</option>
                </select>
            </div>
            <div class="home-card">
                <h4>قفل المحادثات الخاصة 🔒</h4>
                <input type="password" id="passcode-input" class="custom-input" placeholder="تعيين رمز سري للشات الخاص" style="margin-top:8px;">
                <button class="btn-primary" style="margin-top:8px;" onclick="savePasscode()">حفظ الرمز السري</button>
            </div>
        </div>

        <!-- 2. Chat Tab -->
        <div id="tab-chat" class="tab-content hidden">
            <div id="pinned-bar" class="pinned-bar hidden">
                <div>📌 <strong id="pinned-text">رسالة مثبتة</strong></div>
                <span style="cursor:pointer;" onclick="unpinMsg()">✕</span>
            </div>

            <div id="messages-list" style="display:flex; flex-direction:column; gap:10px; flex:1;"></div>
            
            <div id="input-bar" class="input-bar">
                <button class="action-icon" onclick="togglePollModal()">📊</button>
                <label class="action-icon" for="file-input">📎</label>
                <input type="file" id="file-input" class="hidden" onchange="handleFileUpload(event)">
                <button id="mic-btn" class="action-icon" onclick="toggleRecording()">🎤</button>
                <input type="text" id="message-text" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button id="send-msg-btn" class="action-icon" style="background:var(--accent-color); color:#fff;" onclick="sendMsg()">➤</button>
            </div>
        </div>

        <!-- Create Poll Form Modal -->
        <div id="poll-modal" class="home-card hidden" style="position:absolute; bottom:70px; left:15px; right:15px; z-index:10; background:var(--card-bg);">
            <h4>إنشاء استطلاع رأي 📊</h4>
            <input type="text" id="poll-q" class="custom-input" placeholder="السؤال..." style="margin-top:5px;">
            <input type="text" id="poll-op1" class="custom-input" placeholder="الخيار الأول" style="margin-top:5px;">
            <input type="text" id="poll-op2" class="custom-input" placeholder="الخيار الثاني" style="margin-top:5px;">
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn-primary" onclick="createPoll()">نشر</button>
                <button class="btn-primary" style="background:#ef4444;" onclick="togglePollModal()">إلغاء</button>
            </div>
        </div>

        <!-- 3. Members Tab -->
        <div id="tab-members" class="tab-content hidden">
            <input type="text" id="search-member-input" class="custom-input" placeholder="🔍 ابحث عن عضو باسمه..." onkeyup="filterMembers()">
            <div id="members-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <!-- 4. Status Tab -->
        <div id="tab-status" class="tab-content hidden">
            <div class="home-card">
                <h4>إضافة حالة جديدة ⭕</h4>
                <input type="text" id="status-text" class="custom-input" placeholder="ماذا تفكر الآن؟" style="margin: 10px 0;">
                <button class="btn-primary" onclick="postStatus()">نشر الحالة</button>
            </div>
            <div id="statuses-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- 5. Saved Items Tab -->
        <div id="tab-saved" class="tab-content hidden">
            <div id="saved-items-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div id="bottom-nav" class="bottom-nav hidden">
            <button class="nav-btn" onclick="switchTab('home')" id="nav-home"><span>🏠</span>الرئيسية</button>
            <button class="nav-btn active" onclick="switchTab('chat')" id="nav-chat"><span>💬</span>الشات</button>
            <button class="nav-btn" onclick="switchTab('members')" id="nav-members"><span>👥</span>الأعضاء</button>
            <button class="nav-btn" onclick="switchTab('status')" id="nav-status"><span>⭕</span>الحالات</button>
            <button class="nav-btn" onclick="switchTab('saved')" id="nav-saved"><span>💾</span>المحفوظات</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let currentRoom = "";
        let currentChatPath = "";
        let isRecording = false, mediaRecorder = null, audioChunks = [];
        let badWordsList = [];

        window.addEventListener('DOMContentLoaded', () => {
            listenToAdminSettings();
            
            const savedUser = localStorage.getItem('squadlink_user');
            const savedRoom = localStorage.getItem('squadlink_room');
            if (savedUser && savedRoom) {
                document.getElementById('username-input').value = savedUser;
                document.getElementById('room-input').value = savedRoom;
                joinRoom(savedUser, savedRoom);
            }
        });

        /* --- 0. الربط المباشر مع لوحة الأدمن --- */
        function listenToAdminSettings() {
            db.ref('settings').on('value', (snapshot) => {
                const settings = snapshot.val() || {};

                // 1. وضع الصيانة
                if (settings.maintenance) {
                    document.body.innerHTML = "<div style='color:white; text-align:center; padding: 20px;'><h1>🛠️ التطبيق قيد الصيانة حالياً</h1><p style='margin-top:10px; color:#8b949e;'>نعمل على تحسين الخدمات، يرجى العودة لاحقاً.</p></div>";
                    return;
                }

                // 2. تجميد المحادثة
                const msgInput = document.getElementById('message-text');
                const sendBtn = document.getElementById('send-msg-btn');
                if (msgInput && sendBtn) {
                    if (settings.isFrozen) {
                        msgInput.disabled = true;
                        msgInput.placeholder = "🛑 الشات مجمد حالياً من الأدمن...";
                        sendBtn.disabled = true;
                        sendBtn.style.opacity = "0.5";
                    } else {
                        msgInput.disabled = false;
                        msgInput.placeholder = "اكتب رسالتك...";
                        sendBtn.disabled = false;
                        sendBtn.style.opacity = "1";
                    }
                }

                // 3. تغيير الثيم الحي (اللون الرئيسي)
                if (settings.app_theme_color) {
                    document.documentElement.style.setProperty('--accent-color', settings.app_theme_color);
                }

                // 4. عرض الرسالة المثبتة القادمة من اللوحة
                if (settings.pinned_message) {
                    document.getElementById('pinned-text').innerText = settings.pinned_message;
                    document.getElementById('pinned-bar').classList.remove('hidden');
                }

                // 5. تحديث قائمة الكلمات المسيئة
                if (settings.badWords) {
                    badWordsList = Object.values(settings.badWords);
                }
            });
        }

        // فحص الحظر
        function checkUserBan(user) {
            db.ref('banned_users/' + user).on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    document.body.innerHTML = "<div style='color:#ef4444; text-align:center; padding: 20px;'><h1>🚫 تم حظر حسابك من استخدام التطبيق</h1><p style='margin-top:10px; color:#8b949e;'>إذا كنت تعتقد أن هذا عن طريق الخطأ، يرجى التواصل مع الدعم.</p></div>";
                }
            });
        }

        // فلترة النصوص المسيئة
        function filterText(text) {
            let filtered = text;
            badWordsList.forEach(word => {
                if (!word) return;
                const regex = new RegExp(word, "gi");
                filtered = filtered.replace(regex, "***");
            });
            return filtered;
        }

        function saveAndJoin() {
            const user = document.getElementById('username-input').value.trim();
            const room = document.getElementById('room-input').value.trim();
            if (!user || !room) return alert("من فضلك أدخل البيانات!");
            localStorage.setItem('squadlink_user', user);
            localStorage.setItem('squadlink_room', room);
            joinRoom(user, room);
        }

        function joinRoom(user, room) {
            currentUser = user;
            currentRoom = room;
            currentChatPath = 'rooms/' + currentRoom + '/messages';

            // مراقبة حظر المستخدم فور دخوله
            checkUserBan(currentUser);

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            
            document.getElementById('room-name-display').innerText = "غرفة: " + currentRoom;
            document.getElementById('header-avatar').innerText = currentUser.charAt(0).toUpperCase();

            // تسجيل المستخدم في الفايربيس للوحة التحكم
            db.ref('users/' + currentUser).set({ username: currentUser, lastSeen: Date.now() });
            db.ref('rooms/' + currentRoom + '/members/' + currentUser).set({ name: currentUser, online: true });
            db.ref('rooms/' + currentRoom + '/members/' + currentUser).onDisconnect().remove();

            switchTab('chat');
            listenToMessages();
            listenToMembers();
            listenToStatuses();
            listenToPinnedMsg();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active', 'hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            if (tabName === 'saved') loadSavedItems();
        }

        /* Chat & Seen Receipts */
        function listenToMessages() {
            db.ref(currentChatPath).off();
            db.ref(currentChatPath).on('value', (snapshot) => {
                const list = document.getElementById('messages-list');
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) return;

                Object.keys(data).forEach(id => {
                    const msg = data[id];
                    if (msg.sender !== currentUser && (!msg.seenBy || !msg.seenBy[currentUser])) {
                        db.ref(currentChatPath + '/' + id + '/seenBy/' + currentUser).set(true);
                    }
                    renderMessage(id, msg);
                });
                list.parentElement.scrollTop = list.parentElement.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('message-text');
            const rawText = input.value.trim();
            if (!rawText) return;

            // فلترة الرسالة من الكلمات المسيئة
            const cleanText = filterText(rawText);

            db.ref(currentChatPath).push({ sender: currentUser, text: cleanText, timestamp: Date.now() });
            input.value = "";
        }

        /* Pinned Messages */
        function pinMsg(text) {
            db.ref('rooms/' + currentRoom + '/pinned').set(text);
        }
        function unpinMsg() {
            db.ref('rooms/' + currentRoom + '/pinned').remove();
        }
        function listenToPinnedMsg() {
            db.ref('rooms/' + currentRoom + '/pinned').on('value', (snapshot) => {
                const text = snapshot.val();
                const bar = document.getElementById('pinned-bar');
                if (text) {
                    document.getElementById('pinned-text').innerText = text;
                    bar.classList.remove('hidden');
                } else {
                    bar.classList.add('hidden');
                }
            });
        }

        /* Polls */
        function togglePollModal() { document.getElementById('poll-modal').classList.toggle('hidden'); }
        function createPoll() {
            const q = document.getElementById('poll-q').value, op1 = document.getElementById('poll-op1').value, op2 = document.getElementById('poll-op2').value;
            if (!q || !op1 || !op2) return alert("أكمل بيانات التصويت!");
            
            db.ref(currentChatPath).push({
                sender: currentUser, isPoll: true, question: filterText(q),
                options: { op1: { text: filterText(op1), votes: 0 }, op2: { text: filterText(op2), votes: 0 } },
                timestamp: Date.now()
            });
            togglePollModal();
        }
        function votePoll(msgId, opKey) {
            db.ref(currentChatPath + '/' + msgId + '/options/' + opKey + '/votes').transaction(v => (v || 0) + 1);
        }

        function renderMessage(msgId, msg) {
            const list = document.getElementById('messages-list');
            const isMe = msg.sender === currentUser;
            const div = document.createElement('div');
            div.className = `msg-wrapper ${isMe ? 'msg-sent' : 'msg-received'}`;

            let content = msg.text ? `<div>${msg.text}</div>` : '';
            
            // Poll
            if (msg.isPoll) {
                content = `
                    <div class="poll-box">
                        <strong>📊 ${msg.question}</strong>
                        <button class="poll-option-btn" onclick="votePoll('${msgId}', 'op1')"><span>${msg.options.op1.text}</span> <span>(${msg.options.op1.votes || 0})</span></button>
                        <button class="poll-option-btn" onclick="votePoll('${msgId}', 'op2')"><span>${msg.options.op2.text}</span> <span>(${msg.options.op2.votes || 0})</span></button>
                    </div>
                `;
            }

            // Seen check
            const seenCount = msg.seenBy ? Object.keys(msg.seenBy).length : 0;
            const seenHTML = isMe ? `<span class="seen-status">${seenCount > 0 ? '✔️✔️' : '✔️'}</span>` : '';

            div.innerHTML = `
                <div class="msg-sender">${msg.sender} ${seenHTML}</div>
                <div class="msg-bubble">
                    ${content}
                    <div class="action-bar-sm">
                        <span onclick="pinMsg('${(msg.text || 'استطلاع').replace(/'/g, "\\'")}')">تثبيت 📌</span>
                        ${isMe ? `<span style="color:#ef4444;" onclick="db.ref('${currentChatPath}/${msgId}').remove()">مسح 🗑️</span>` : ''}
                    </div>
                </div>
            `;
            list.appendChild(div);
        }

        /* Private Chat Lock & Themes */
        function savePasscode() {
            const code = document.getElementById('passcode-input').value;
            localStorage.setItem('squadlink_passcode', code);
            alert("تم حفظ الرمز السري بنجاح!");
        }

        function startPrivateChat(targetUser) {
            const savedCode = localStorage.getItem('squadlink_passcode');
            if (savedCode) {
                const input = prompt("أدخل الرمز السري للمحادثة الخاصة:");
                if (input !== savedCode) return alert("رمز سري خاطئ!");
            }

            const privateChatId = [currentUser, targetUser].sort().join('_private_');
            currentChatPath = 'private_chats/' + privateChatId;
            document.getElementById('room-name-display').innerText = "خاص مع: " + targetUser;
            document.getElementById('back-to-room-btn').classList.remove('hidden');
            switchTab('chat');
            listenToMessages();
        }

        function changeTheme(theme) {
            document.body.className = theme === 'light' ? 'theme-light' : (theme === 'cyber' ? 'theme-cyber' : '');
        }

        function resetToRoomChat() {
            currentChatPath = 'rooms/' + currentRoom + '/messages';
            document.getElementById('room-name-display').innerText = "غرفة: " + currentRoom;
            document.getElementById('back-to-room-btn').classList.add('hidden');
            switchTab('chat');
            listenToMessages();
        }

        function listenToMembers() {
            db.ref('rooms/' + currentRoom + '/members').on('value', (snapshot) => {
                const list = document.getElementById('members-list');
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) return;
                Object.values(data).forEach(m => {
                    if (m.name === currentUser) return;
                    const item = document.createElement('div');
                    item.className = "member-item";
                    item.innerHTML = `<span>${m.name}</span><button class="btn-sm" onclick="startPrivateChat('${m.name}')">خاص 🔒</button>`;
                    list.appendChild(item);
                });
            });
        }

        function filterMembers() {
            const q = document.getElementById('search-member-input').value.toLowerCase();
            document.querySelectorAll('#members-list .member-item').forEach(item => {
                const name = item.querySelector('span').innerText.toLowerCase();
                item.style.display = name.includes(q) ? 'flex' : 'none';
            });
        }

        function postStatus() {
            const text = document.getElementById('status-text').value.trim();
            if (!text) return;
            const cleanStatus = filterText(text);
            db.ref('rooms/' + currentRoom + '/statuses').push({ sender: currentUser, text: cleanStatus, timestamp: Date.now() });
            document.getElementById('status-text').value = "";
        }

        function listenToStatuses() {
            db.ref('rooms/' + currentRoom + '/statuses').on('value', (snapshot) => {
                const list = document.getElementById('statuses-list');
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) return;
                Object.values(data).reverse().forEach(s => {
                    const item = document.createElement('div');
                    item.className = "home-card";
                    item.innerHTML = `<strong>${s.sender}</strong><div>${s.text}</div>`;
                    list.appendChild(item);
                });
            });
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
