<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquadLink Chat Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --input-bg: #21262d;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --msg-sent: #238636;
            --msg-received: #21262d;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .app-container {
            width: 100%; max-width: 450px; height: 95vh; background: var(--card-bg);
            border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column;
            overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Login Screen */
        .login-screen {
            position: absolute; inset: 0; background: var(--card-bg); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; gap: 15px;
        }
        .login-title { font-size: 24px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .custom-input { width: 100%; padding: 12px 15px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; margin-bottom: 10px; }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* Header & Search */
        .chat-header { padding: 12px 16px; background: #010409; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; background: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
        .search-bar { flex: 1; min-width: 100%; display: none; }
        .search-bar input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: #fff; outline: none; font-size: 13px; }

        /* Messages Area */
        .messages-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-sent { align-self: flex-start; }
        .msg-received { align-self: flex-end; }
        
        .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
        .msg-sent .msg-bubble { background: var(--msg-sent); color: #fff; border-bottom-left-radius: 2px; }
        .msg-received .msg-bubble { background: var(--msg-received); color: var(--text-color); border: 1px solid var(--border-color); border-bottom-right-radius: 2px; }
        
        .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
        .msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; display: flex; justify-content: space-between; }
        .reply-preview { background: rgba(0,0,0,0.25); border-right: 3px solid var(--accent-color); padding: 6px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 6px; }

        /* Audio Player Styling */
        audio { max-width: 100%; height: 35px; margin-top: 5px; outline: none; }

        /* Actions & Reactions */
        .msg-actions { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); margin-top: 5px; opacity: 0.9; }
        .msg-actions span { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .msg-actions span:hover { background: rgba(255,255,255,0.1); color: var(--accent-color); }
        .reactions-box { display: flex; gap: 4px; margin-top: 4px; font-size: 14px; }
        .reaction-btn { cursor: pointer; padding: 2px; border-radius: 4px; transition: 0.2s; }
        .reaction-btn:hover { transform: scale(1.2); }

        /* Input Area */
        .reply-bar { background: #161b22; padding: 8px 12px; font-size: 12px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; color: var(--accent-color); }
        .input-bar { padding: 12px; background: #010409; border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
        .input-bar input { flex: 1; padding: 10px 14px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 20px; color: #fff; font-size: 14px; outline: none; }
        .send-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .mic-btn { background: #21262d; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .recording-active { background: #ef4444 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Audio element for notifications -->
    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-screen">
            <div class="login-title">SquadLink Pro 🚀</div>
            <input type="text" id="username-input" class="custom-input" placeholder="اسم المستخدم (مثال: محمد)">
            <input type="text" id="room-input" class="custom-input" placeholder="رمز الغرفة (مثال: 1234)">
            <button class="btn-primary" onclick="saveAndJoin()">دخول الشات</button>
        </div>

        <!-- Header -->
        <div id="chat-header" class="chat-header hidden">
            <div class="header-info">
                <div class="avatar" id="header-avatar">M</div>
                <div>
                    <div class="room-title" id="room-name-display">غرفة المحادثة</div>
                    <div style="font-size:11px; color: #238636;">● متصل الان</div>
                </div>
            </div>
            <div>
                <button onclick="toggleSearch()" style="background:none; border:none; color:white; cursor:pointer; font-size:16px;">🔍</button>
            </div>
            <div id="search-box" class="search-bar">
                <input type="text" id="search-input" placeholder="ابحث في الرسائل..." onkeyup="searchMessages()">
            </div>
        </div>

        <!-- Messages Area -->
        <div id="messages-list" class="messages-container hidden"></div>

        <!-- Reply Preview -->
        <div id="reply-bar" class="reply-bar hidden">
            <span id="reply-text">الرد على رسالة...</span>
            <span style="cursor:pointer; color:#ef4444;" onclick="cancelReply()">إلغاء ✕</span>
        </div>

        <!-- Input Area -->
        <div id="input-bar" class="input-bar hidden">
            <button id="mic-btn" class="mic-btn" onclick="toggleRecording()">🎤</button>
            <input type="text" id="message-text" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let currentRoom = "";
        let replyToMsgId = null;
        let replyToText = null;
        let editMsgId = null;
        let isFirstLoad = true;

        // Audio Recorder State
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // 1. الدخول التلقائي
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('squadlink_user');
            const savedRoom = localStorage.getItem('squadlink_room');
            if (savedUser && savedRoom) {
                document.getElementById('username-input').value = savedUser;
                document.getElementById('room-input').value = savedRoom;
                joinRoom(savedUser, savedRoom);
            }
        });

        function saveAndJoin() {
            const user = document.getElementById('username-input').value.trim();
            const room = document.getElementById('room-input').value.trim();
            if (!user || !room) { alert("اكتب اسمك ورمز الغرفة!"); return; }
            
            localStorage.setItem('squadlink_user', user);
            localStorage.setItem('squadlink_room', room);
            joinRoom(user, room);
        }

        function joinRoom(user, room) {
            currentUser = user;
            currentRoom = room;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('input-bar').classList.remove('hidden');

            document.getElementById('room-name-display').innerText = "غرفة: " + currentRoom;
            document.getElementById('header-avatar').innerText = currentUser.charAt(0).toUpperCase();

            listenToMessages();
        }

        // 2. استقبال وعرض الرسائل
        function listenToMessages() {
            const roomRef = db.ref('rooms/' + currentRoom + '/messages');
            roomRef.on('value', (snapshot) => {
                const messagesList = document.getElementById('messages-list');
                messagesList.innerHTML = "";

                const data = snapshot.val();
                if (!data) return;

                const msgKeys = Object.keys(data);
                msgKeys.forEach((msgId) => {
                    renderMessage(msgId, data[msgId]);
                });

                if (!isFirstLoad) {
                    const lastMsgKey = msgKeys[msgKeys.length - 1];
                    if (data[lastMsgKey].sender !== currentUser) {
                        document.getElementById('notif-sound').play().catch(e => console.log("Auto-play blocked"));
                    }
                }
                isFirstLoad = false;
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        // 3. إرسال وتعديل الرسائل النصية
        function sendMsg() {
            const inputField = document.getElementById('message-text');
            const text = inputField.value.trim();
            if (!text) return;

            if (editMsgId) {
                db.ref('rooms/' + currentRoom + '/messages/' + editMsgId).update({ text: text, isEdited: true });
                editMsgId = null;
            } else {
                const newMsgRef = db.ref('rooms/' + currentRoom + '/messages').push();
                newMsgRef.set({
                    sender: currentUser,
                    text: text,
                    timestamp: Date.now(),
                    replyTo: replyToText || null,
                    reactions: {}
                });
            }

            inputField.value = "";
            cancelReply();
        }

        // 4. التسجيل الصوتي (Voice Notes)
        async function toggleRecording() {
            const micBtn = document.getElementById('mic-btn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            sendAudioMsg(base64Audio);
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording-active');
                    micBtn.innerText = '⏹️';
                } catch (err) {
                    alert("يرجى السماح بالوصول للميكروفون لتسجيل الفويس!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording-active');
                micBtn.innerText = '🎤';
            }
        }

        function sendAudioMsg(base64Audio) {
            const newMsgRef = db.ref('rooms/' + currentRoom + '/messages').push();
            newMsgRef.set({
                sender: currentUser,
                audio: base64Audio,
                timestamp: Date.now(),
                replyTo: replyToText || null,
                reactions: {}
            });
            cancelReply();
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMsg(); }

        // 5. بناء هيكل الرسالة في الشاشة
        function renderMessage(msgId, msg) {
            const messagesList = document.getElementById('messages-list');
            const isMe = msg.sender === currentUser;
            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isMe ? 'msg-sent' : 'msg-received'} msg-item`;
            wrapper.setAttribute('data-text', (msg.text || "صوت").toLowerCase());

            let reactionsHTML = '';
            if (msg.reactions) {
                const reactionCounts = {};
                Object.values(msg.reactions).forEach(r => reactionCounts[r] = (reactionCounts[r] || 0) + 1);
                for (let r in reactionCounts) { reactionsHTML += `<span>${r} ${reactionCounts[r]}</span> `; }
            }

            const safeText = msg.text ? msg.text.replace(/'/g, "\\'").replace(/"/g, '&quot;') : "تسجيل صوتي";

            wrapper.innerHTML = `
                <div class="msg-sender">${msg.sender}</div>
                <div class="msg-bubble">
                    ${msg.replyTo ? `<div class="reply-preview">رد على: ${msg.replyTo}</div>` : ''}
                    
                    ${msg.text ? `<div>${msg.text}</div>` : ''}
                    ${msg.audio ? `<audio controls src="${msg.audio}"></audio>` : ''}
                    
                    <div class="reactions-box" style="color:yellow;">${reactionsHTML}</div>
                    
                    <div class="msg-time">
                        <span>${timeStr} ${msg.isEdited ? '(معدلة)' : ''}</span>
                    </div>
                </div>
                
                <div class="msg-actions">
                    <span class="reaction-btn" onclick="addReaction('${msgId}', '👍')">👍</span>
                    <span class="reaction-btn" onclick="addReaction('${msgId}', '❤️')">❤️</span>
                    <span class="reaction-btn" onclick="addReaction('${msgId}', '😂')">😂</span>
                    
                    <span onclick="setReply('${safeText}')">رد ↩️</span>
                    ${msg.text ? `<span onclick="copyMsg('${safeText}')">نسخ 📋</span>` : ''}
                    ${isMe && msg.text ? `<span onclick="setEdit('${msgId}', '${safeText}')">تعديل ✏️</span>` : ''}
                    ${isMe ? `<span onclick="deleteMsg('${msgId}')" style="color:#ef4444;">حذف 🗑️</span>` : ''}
                </div>
            `;
            messagesList.appendChild(wrapper);
        }

        // 6. باقي الميزات
        function setReply(text) {
            replyToText = text;
            document.getElementById('reply-text').innerText = "رد على: " + text.substring(0, 20) + "...";
            document.getElementById('reply-bar').classList.remove('hidden');
            document.getElementById('message-text').focus();
        }

        function cancelReply() {
            replyToText = null;
            editMsgId = null;
            document.getElementById('reply-bar').classList.add('hidden');
            document.getElementById('message-text').value = "";
        }

        function setEdit(msgId, oldText) {
            editMsgId = msgId;
            document.getElementById('message-text').value = oldText;
            document.getElementById('reply-text').innerText = "وضع تعديل الرسالة...";
            document.getElementById('reply-bar').classList.remove('hidden');
            document.getElementById('message-text').focus();
        }

        function deleteMsg(msgId) {
            if (confirm("حذف الرسالة للجميع؟")) {
                db.ref('rooms/' + currentRoom + '/messages/' + msgId).remove();
            }
        }

        function copyMsg(text) {
            navigator.clipboard.writeText(text);
            alert("تم نسخ الرسالة!");
        }

        function addReaction(msgId, emoji) {
            db.ref('rooms/' + currentRoom + '/messages/' + msgId + '/reactions/' + currentUser).set(emoji);
        }

        function toggleSearch() {
            const searchBox = document.getElementById('search-box');
            searchBox.style.display = searchBox.style.display === 'block' ? 'none' : 'block';
            if (searchBox.style.display === 'block') document.getElementById('search-input').focus();
        }

        function searchMessages() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const messages = document.querySelectorAll('.msg-item');
            messages.forEach(msg => {
                const text = msg.getAttribute('data-text');
                msg.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
