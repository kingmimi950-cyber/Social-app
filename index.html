<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الشات الاحترافي | Ultimate Chat App</title>
    
    <!-- إعدادات PWA لتثبيت التطبيق على الهاتف -->
    <link rel="manifest" href="data:application/json;base64,ewogICJzaG9ydF9uYW1lIjogIlNoYXRBcHAiLAogICJuYW1lIjogIlVs dGltYXRlIENoYXQgQXBwIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjE3MmEiLAogICJ0aGVtZV9jb2xvciI6ICIjM2I4MmY2Igp9">

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --msg-me: #2563eb;
            --msg-other: #334155;
            --input-bg: #0f172a;
        }

        body.light-theme {
            --bg: #f1f5f9;
            --card: #ffffff;
            --accent: #2563eb;
            --text: #0f172a;
            --text-muted: #64748b;
            --msg-me: #2563eb;
            --msg-other: #e2e8f0;
            --input-bg: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .login-screen {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto;
        }

        .login-screen h2 { margin-bottom: 8px; color: var(--accent); }
        .login-screen p { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; }

        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--text-muted);
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        button {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .avatar-picker { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .avatar-option { font-size: 22px; cursor: pointer; padding: 4px; border-radius: 50%; border: 2px solid transparent; }
        .avatar-option.selected { border-color: var(--accent); background: rgba(255,255,255,0.1); }

        .chat-screen { display: flex; flex-direction: column; height: 100%; }

        .chat-header {
            padding: 10px 14px;
            background: var(--input-bg);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-tag { font-size: 11px; background: var(--msg-other); padding: 2px 6px; border-radius: 8px; }
        .online-count { font-size: 11px; color: #10b981; font-weight: bold; }

        .pinned-bar {
            background: rgba(59, 130, 246, 0.15);
            border-bottom: 1px solid var(--accent);
            padding: 6px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            color: var(--accent);
        }

        .messages-box {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message.me { align-self: flex-start; background: var(--msg-me); color: #fff; border-bottom-right-radius: 2px; }
        .message.other { align-self: flex-end; background: var(--msg-other); color: var(--text); border-bottom-left-radius: 2px; }

        .mention-highlight { background: #f59e0b; color: #000; padding: 1px 4px; border-radius: 4px; font-weight: bold; }

        /* التصويت (Polls) */
        .poll-box { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; margin-top: 6px; }
        .poll-option { background: var(--card); padding: 6px; margin: 4px 0; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; }

        .msg-actions {
            display: flex;
            gap: 6px;
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.8;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 4px;
            flex-wrap: wrap;
        }
        .msg-actions span { cursor: pointer; }

        .typing-indicator { font-size: 11px; color: var(--text-muted); padding: 2px 14px; height: 14px; font-style: italic; }

        .chat-input-area {
            padding: 10px;
            background: var(--input-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 6px;
            align-items: center;
            position: relative;
        }

        .chat-input-area input { margin-bottom: 0; flex: 1; }

        /* قائمة المنشن */
        .mention-popup {
            position: absolute;
            bottom: 50px;
            right: 10px;
            background: var(--card);
            border: 1px solid var(--text-muted);
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
            width: 150px;
            z-index: 10;
        }
        .mention-item { padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .mention-item:hover { background: var(--accent); color: #fff; }

        /* لوحة التحكم للأدمن */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 80%; max-width: 350px; }

        .hidden { display: none !important; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة الدخول والتسجيل -->
        <div id="login-screen" class="login-screen">
            <h2>💬 شات أونلاين الشامل</h2>
            <p>حدد بروفايلك واشترك في المحادثة</p>

            <div class="avatar-picker">
                <span class="avatar-option selected" onclick="selectAvatar('👤', this)">👤</span>
                <span class="avatar-option" onclick="selectAvatar('🐱', this)">🐱</span>
                <span class="avatar-option" onclick="selectAvatar('🚀', this)">🚀</span>
                <span class="avatar-option" onclick="selectAvatar('🎮', this)">🎮</span>
                <span class="avatar-option" onclick="selectAvatar('🤖', this)">🤖</span>
            </div>

            <input type="text" id="username" placeholder="اسمك / اللقب">
            <input type="text" id="room-code" placeholder="اسم أو كود الغرفة">
            <input type="password" id="room-pass" placeholder="كلمة سر الغرفة (اختياري)">
            
            <button onclick="enterChat()">دخول الشات</button>
        </div>

        <!-- 2. شاشة المحادثة -->
        <div id="chat-screen" class="chat-screen hidden">
            <div class="chat-header">
                <div>
                    <h3 id="display-user">مرحباً</h3>
                    <span id="display-room" class="room-tag">غرفة: --</span>
                    <span id="online-count" class="online-count">🟢 0</span>
                </div>
                <div>
                    <button id="admin-btn" onclick="openAdminModal()" class="hidden" style="padding:4px 8px; font-size:11px; background:#f59e0b; color:#000;">⚙️ أدمن</button>
                    <button onclick="leaveChat()" style="background:#ef4444; font-size:11px; padding:4px 8px;">خروج</button>
                </div>
            </div>

            <div id="pinned-bar" class="pinned-bar hidden">
                <span id="pinned-text">📌 مثبت...</span>
            </div>

            <div id="messages-box" class="messages-box"></div>

            <div id="typing-txt" class="typing-indicator"></div>

            <!-- قائمة اقتراحات المنشن -->
            <div id="mention-popup" class="mention-popup hidden"></div>

            <div class="chat-input-area">
                <button onclick="openPollModal()" title="إنشاء تصويت" style="padding:6px 10px;">📊</button>
                <input type="text" id="msg-input" placeholder="اكتب رسالتك (@ للتقييد)..." oninput="handleInput()" onkeypress="checkEnter(event)">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم الأدمن Modal -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <h4>⚙️ لوحة تحكم الأدمن</h4>
            <label style="font-size:12px;">اختر وقت الحذف التلقائي للرسائل:</label>
            <select id="auto-delete-timer" onchange="setDisappearingTimer(this.value)">
                <option value="off">معطل (لا تحذف)</option>
                <option value="3600000">بعد ساعة واحدة</option>
                <option value="86400000">بعد 24 ساعة</option>
            </select>
            <br><br>
            <button onclick="closeModal('admin-modal')" style="width:100%;">إغلاق</button>
        </div>
    </div>

    <!-- نافذة إنشاء تصويت Modal -->
    <div id="poll-modal" class="modal hidden">
        <div class="modal-content">
            <h4>📊 إنشاء استطلاع رأي</h4>
            <input type="text" id="poll-q" placeholder="السؤال...">
            <input type="text" id="poll-opt1" placeholder="الخيار الأول">
            <input type="text" id="poll-opt2" placeholder="الخيار الثاني">
            <button onclick="createPoll()" style="width:100%;">نشر التصويت</button>
            <button onclick="closeModal('poll-modal')" style="width:100%; background:transparent; color:var(--text); margin-top:5px;">إلغاء</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDYK-evC0qZWKJupgCakP2Em4X5yT_Qyc",
            authDomain: "social-3108b.firebaseapp.com",
            projectId: "social-3108b",
            storageBucket: "social-3108b.firebasestorage.app",
            messagingSenderId: "489846983999",
            appId: "1:489846983999:web:1e485be0aedb8a665e178a",
            databaseURL: "https://social-3108b-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let currentAvatar = "👤";
        let currentRoom = "";
        let roomAdmin = "";
        let onlineUsersList = [];
        let blockedUsers = [];

        function selectAvatar(emoji, el) {
            currentAvatar = emoji;
            document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }

        function enterChat() {
            const nameIn = document.getElementById('username').value.trim();
            const roomIn = document.getElementById('room-code').value.trim();
            const passIn = document.getElementById('room-pass').value.trim();

            if (!nameIn || !roomIn) return alert("يرجى إدخال البيانات!");

            db.ref(`chat_rooms/${roomIn}/settings`).once('value', snapshot => {
                const settings = snapshot.val() || {};
                if (settings.password && settings.password !== passIn) return alert("كلمة السر خاطئة!");

                if (!settings.password && passIn) {
                    db.ref(`chat_rooms/${roomIn}/settings`).set({ password: passIn });
                }

                db.ref(`chat_rooms/${roomIn}/admin`).once('value', adminSnap => {
                    if (!adminSnap.exists()) {
                        db.ref(`chat_rooms/${roomIn}/admin`).set(nameIn);
                        roomAdmin = nameIn;
                    } else {
                        roomAdmin = adminSnap.val();
                    }

                    currentUser = nameIn;
                    currentRoom = roomIn;

                    document.getElementById('display-user').innerText = `${currentAvatar} ${currentUser}`;
                    document.getElementById('display-room').innerText = "غرفة: " + currentRoom;

                    if (currentUser === roomAdmin) document.getElementById('admin-btn').classList.remove('hidden');

                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('chat-screen').classList.remove('hidden');

                    setupOnlineStatus();
                    listenForMessages();
                    listenForDisappearing();
                });
            });
        }

        function setupOnlineStatus() {
            const userRef = db.ref(`chat_rooms/${currentRoom}/online/${currentUser}`);
            userRef.set({ avatar: currentAvatar });
            userRef.onDisconnect().remove();

            db.ref(`chat_rooms/${currentRoom}/online`).on('value', snapshot => {
                const users = snapshot.val() || {};
                onlineUsersList = Object.keys(users);
                document.getElementById('online-count').innerText = `🟢 ${onlineUsersList.length}`;
            });
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const msgData = {
                user: currentUser,
                avatar: currentAvatar,
                text: text,
                timestamp: Date.now()
            };

            db.ref(`chat_rooms/${currentRoom}/messages`).push(msgData);
            input.value = "";
            document.getElementById('mention-popup').classList.add('hidden');
        }

        function listenForMessages() {
            db.ref(`chat_rooms/${currentRoom}/messages`).on('value', snapshot => {
                const msgs = snapshot.val() || {};
                renderMessages(msgs);
            });
        }

        function renderMessages(messagesObj) {
            const messagesBox = document.getElementById('messages-box');
            messagesBox.innerHTML = "";

            Object.keys(messagesObj).forEach(msgId => {
                const msg = messagesObj[msgId];
                if (blockedUsers.includes(msg.user)) return; // يتجاهل رسائل المحظورين

                const isMe = msg.user === currentUser;
                let textHtml = escapeHtml(msg.text);

                // Highlight Mention (@الاسم)
                if (textHtml.includes(`@${currentUser}`)) {
                    textHtml = textHtml.replace(new RegExp(`@${currentUser}`, 'g'), `<span class="mention-highlight">@${currentUser}</span>`);
                }

                // عرض التقرير والتصويت والحظر
                let actionsHtml = `
                    <div class="msg-actions">
                        ${!isMe ? `<span onclick="blockUser('${msg.user}')">🚫 حظر</span>` : ''}
                        ${!isMe ? `<span onclick="reportMsg('${msgId}')">⚠️ بلاغ</span>` : ''}
                `;

                if (isMe || currentUser === roomAdmin) {
                    actionsHtml += `<span onclick="deleteMessage('${msgId}')" style="color:#ef4444;">🗑️ حذف</span>`;
                }
                actionsHtml += `</div>`;

                // إذا كانت الرسالة عبارة عن استطلاع رأي (Poll)
                let pollHtml = "";
                if (msg.poll) {
                    pollHtml = `
                        <div class="poll-box">
                            <b>📊 ${escapeHtml(msg.poll.question)}</b>
                            <div class="poll-option" onclick="votePoll('${msgId}', 1)">
                                <span>1. ${escapeHtml(msg.poll.opt1)}</span> <span>${msg.poll.votes1 || 0}</span>
                            </div>
                            <div class="poll-option" onclick="votePoll('${msgId}', 2)">
                                <span>2. ${escapeHtml(msg.poll.opt2)}</span> <span>${msg.poll.votes2 || 0}</span>
                            </div>
                        </div>
                    `;
                }

                const msgElement = document.createElement('div');
                msgElement.className = `message ${isMe ? 'me' : 'other'}`;
                msgElement.innerHTML = `
                    <span style="font-size:11px; font-weight:bold;">${msg.avatar || '👤'} ${msg.user}</span>
                    <div>${textHtml}</div>
                    ${pollHtml}
                    ${actionsHtml}
                `;

                messagesBox.appendChild(msgElement);
            });

            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        /* ميزة @Mentions (الإشارة للغير) */
        function handleInput() {
            const val = document.getElementById('msg-input').value;
            const popup = document.getElementById('mention-popup');

            if (val.includes('@')) {
                const query = val.split('@').pop().toLowerCase();
                const matches = onlineUsersList.filter(u => u.toLowerCase().startsWith(query) && u !== currentUser);

                if (matches.length > 0) {
                    popup.innerHTML = matches.map(u => `<div class="mention-item" onclick="applyMention('${u}')">${u}</div>`).join('');
                    popup.classList.remove('hidden');
                } else {
                    popup.classList.add('hidden');
                }
            } else {
                popup.classList.add('hidden');
            }
        }

        function applyMention(username) {
            const input = document.getElementById('msg-input');
            const parts = input.value.split('@');
            parts.pop();
            input.value = parts.join('@') + `@${username} `;
            document.getElementById('mention-popup').classList.add('hidden');
            input.focus();
        }

        /* ميزة استطلاع الرأي (Polls) */
        function openPollModal() { document.getElementById('poll-modal').classList.remove('hidden'); }
        function createPoll() {
            const q = document.getElementById('poll-q').value.trim();
            const o1 = document.getElementById('poll-opt1').value.trim();
            const o2 = document.getElementById('poll-opt2').value.trim();

            if (!q || !o1 || !o2) return alert("املاً جميع الحقول!");

            db.ref(`chat_rooms/${currentRoom}/messages`).push({
                user: currentUser,
                avatar: currentAvatar,
                poll: { question: q, opt1: o1, opt2: o2, votes1: 0, votes2: 0 },
                timestamp: Date.now()
            });

            closeModal('poll-modal');
        }

        function votePoll(msgId, option) {
            const field = option === 1 ? 'votes1' : 'votes2';
            db.ref(`chat_rooms/${currentRoom}/messages/${msgId}/poll/${field}`).transaction(v => (v || 0) + 1);
        }

        /* حظر المستخدم والبلاغات (Moderation) */
        function blockUser(user) {
            if (confirm(`هل تريد حظر ${user} وعدم رؤية رسائله؟`)) {
                blockedUsers.push(user);
                listenForMessages();
            }
        }

        function reportMsg(msgId) {
            db.ref(`chat_rooms/${currentRoom}/reports`).push({ msgId, reportedBy: currentUser });
            alert("تم إرسال البلاغ للأدمن!");
        }

        /* الرسائل المختفية تلقائياً (Disappearing Messages) */
        function setDisappearingTimer(timeInMs) {
            db.ref(`chat_rooms/${currentRoom}/settings/disappearingTime`).set(timeInMs);
        }

        function listenForDisappearing() {
            db.ref(`chat_rooms/${currentRoom}/settings/disappearingTime`).on('value', snapshot => {
                const timer = snapshot.val();
                if (timer && timer !== "off") {
                    const expiryLimit = Date.now() - parseInt(timer);
                    db.ref(`chat_rooms/${currentRoom}/messages`).once('value', msgsSnap => {
                        const msgs = msgsSnap.val() || {};
                        Object.keys(msgs).forEach(id => {
                            if (msgs[id].timestamp < expiryLimit) {
                                db.ref(`chat_rooms/${currentRoom}/messages/${id}`).remove();
                            }
                        });
                    });
                }
            });
        }

        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function deleteMessage(id) { db.ref(`chat_rooms/${currentRoom}/messages/${id}`).remove(); }
        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }
        function escapeHtml(t) { const d = document.createElement('div'); d.innerText = t; return d.innerHTML; }

        function leaveChat() {
            db.ref(`chat_rooms/${currentRoom}/online/${currentUser}`).remove();
            location.reload();
        }
    </script>
</body>
</html>
